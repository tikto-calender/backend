name: Deploy development
on:
  push:
    branches:
      - dev
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-dev
  cancel-in-progress: false
jobs:
  publish:
    uses: tikto-calender/reusable-workflow/.github/workflows/container-publish.yml@main
    with:
      repository: tikto/backend
  deploy:
    needs: publish
    uses: tikto-calender/reusable-workflow/.github/workflows/ecs-deploy.yml@main
    with:
      image: ${{ needs.publish.outputs.image }}
      container: backend
      environment: dev
