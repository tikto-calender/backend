name: Deploy Dev
on:
  push:
    branches:
      - dev
    paths:
      - 'dockerfile'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cd.yml'
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: tikto-calender/reusable-workflow/.github/workflows/cd-dev.yml@main
    with:
      component: backend
      gitops-repository: ${{ vars.GITOPS_REPOSITORY || 'tikto-calender/manifest' }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
