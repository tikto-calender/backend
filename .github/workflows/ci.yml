name: CI
on:
  pull_request:
    branches:
      - dev
      - feat/*
    paths:
      

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: tikto-calender/reusable-workflow/.github/workflows/ci-node.yml@main
    with:
      install-command: npm ci --ignore-scripts
      build-command: npm run syntax
