name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test and syntax
    uses: tikto-calender/reusable-workflow/.github/workflows/node-ci.yml@main
    with:
      install-command: npm ci --ignore-scripts
      build-command: npm run syntax
      coverage-artifact-name: backend-coverage

  sonar:
    name: SonarQube
    needs: quality
    uses: tikto-calender/reusable-workflow/.github/workflows/sonarqube.yml@main
    with:
      sonar-host-url: ${{ vars.SONAR_HOST_URL }}
      coverage-artifact-name: backend-coverage
      coverage-download-path: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
