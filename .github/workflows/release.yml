name: Release production
on:
  push:
    tags:
      - v*
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: release-production
  cancel-in-progress: false
jobs:
  release:
    uses: tikto-calender/reusable-workflow/.github/workflows/container-release.yml@main
    with:
      repository: tikto/backend
      container: tikto
      component: backend
      gitops-repository: ${{ vars.GITOPS_REPOSITORY || 'Flavoriy/gitops-manifest' }}
    secrets: inherit
